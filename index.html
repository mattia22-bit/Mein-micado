<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#68a96d"><title>Mein Micado</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#343a36;background:#f1f6f0}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:auto;min-height:100vh;background:#f9fbf8;padding:22px 18px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:2px 0 18px;font-size:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:#648188;font-weight:800}.panel{background:white;border:1px solid #e1e9e7;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #143e4208}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dae4e2;display:flex;justify-content:center;padding:9px 4px 18px;gap:4px}nav button{flex:1;max-width:160px;font-size:12px;background:none;color:#567078}nav button.active{color:#68a96d;font-weight:800}button{border:0;border-radius:11px;padding:12px 14px;font-weight:700;cursor:pointer;background:#68a96d;color:white}button.secondary{background:#e8f3e7;color:#387d42}button.ghost{background:transparent;color:#637b7f;padding:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cddcda;border-radius:10px;font:inherit;background:white}textarea{min-height:135px;resize:vertical}.row{display:flex;align-items:center;gap:9px}.row>*{min-width:0}.between{justify-content:space-between}.muted{color:#688087;font-size:13px}.chips{display:flex;gap:8px;margin:12px 0}.chips button{flex:1;background:#e8f3e7;color:#47666a}.chips button.selected{background:#68a96d;color:white}.task{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #e9eeee}.task input{width:18px;height:18px}.task .name{flex:1}.done{text-decoration:line-through;color:#94a3a4}.pill{font-size:11px;border-radius:20px;padding:5px 8px;background:#f0f4f3}.hidden{display:none}iframe{width:100%;height:70vh;border:1px solid #e3e9e7;border-radius:12px}.plan-image{display:block;width:100%;height:auto;object-fit:contain;border:1px solid #e3e9e7;border-radius:12px}.small{font-size:12px}label{font-size:13px;font-weight:650;display:block;margin:10px 0 5px}.stat{font-size:32px;font-weight:800;margin:4px 0}a{color:#68a96d}.plan-title{font-size:13px;font-weight:750;margin:13px 0 7px}.plan-tile{background:#f5f8f4;border:1px solid #dce7dc;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:100px}.plan-tile-large{min-height:160px}.plan-thumb{display:block;width:100%;height:auto;object-fit:contain}.plan-placeholder{color:#688087;font-size:12px;text-align:center;padding:25px 8px}.plan-small-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan-small-grid .plan-tile{min-height:110px}.chips{flex-wrap:wrap}.chips button{font-size:12px;padding:11px 8px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f2f7f1;border-radius:12px;padding:12px}.metric strong{font-size:24px;display:block}.due{border-left:3px solid #e5a35b;padding:8px 10px;margin:8px 0;background:#fffbf5;border-radius:5px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.quick-link{display:block;background:#edf6ed;border-radius:12px;padding:13px;color:#32683b;text-decoration:none;font-weight:700;overflow-wrap:anywhere}.checkline{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ed}.checkline input{width:19px;height:19px;flex:none}.checkline span{flex:1}.notice{padding:12px;background:#fff6e9;border:1px solid #f0d8b4;border-radius:10px;font-size:13px}.actionrow{display:flex;gap:8px;flex-wrap:wrap}.actionrow button{flex:1}.subtle{font-size:12px;color:#6d8180}.divider{height:1px;background:#e6eeea;margin:14px 0}button:disabled{opacity:.5}</style></head><body><main class="shell"><header><img src="logo.png" alt="Micado" style="width:185px;max-width:72%;height:auto;object-fit:contain"><span style="color:#68a96d">●</span></header><h1 id="heading">Übersicht</h1><section id="home"></section><section id="plan" class="hidden"></section><section id="tasks" class="hidden"></section><section id="docs" class="hidden"></section><section id="handover" class="hidden"></section><section id="links" class="hidden"></section></main><nav><button data-tab="home" class="active">⌂<br>Start</button><button data-tab="plan">▦<br>Dienstplan</button><button data-tab="tasks">☑<br>Aufgaben</button><button data-tab="handover">☷<br>Übergabe</button><button data-tab="docs">▤<br>Doku</button></nav><script>
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='home',site='Bönninghardt',tasks=JSON.parse(localStorage.getItem('micado_tasks')||'[]'),planMeta=JSON.parse(localStorage.getItem('micado_plan_meta')||'null');let planURL=null;const PLAN_TYPES=[['team','Gesamt Team'],['blau','Blau'],['nacht','Nachtwachen']];let planFiles={team:null,blau:null,nacht:null};let planMetaAll=JSON.parse(localStorage.getItem('micado_plan_meta_all')||'{}');const DB_NAME="micado-local";function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore("files");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function storePlan(file,key){const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
async function restorePlan(){try{const db=await openDB();for(const [key] of PLAN_TYPES){let f=await new Promise((resolve,reject)=>{const req=db.transaction("files").objectStore("files").get(key);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!f&&key==='team'){f=await new Promise((resolve,reject)=>{const req=db.transaction("files").objectStore("files").get('current');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(f){planMetaAll.team=planMeta||{name:f.name,type:f.type};localStorage.setItem('micado_plan_meta_all',JSON.stringify(planMetaAll))}}if(f){planFiles[key]=URL.createObjectURL(f)}}db.close();render()}catch(e){console.warn(e)}}
function planThumb(key,large=false){const meta=planMetaAll[key];const url=planFiles[key];const isImage=(meta?.type||'').startsWith('image/')||/\.(png|jpe?g|webp|heic)$/i.test(meta?.name||'');return `<div class="plan-tile ${large?'plan-tile-large':''}" data-view="${key}" role="button" tabindex="0" aria-label="${safe(PLAN_TYPES.find(p=>p[0]===key)?.[1])} öffnen">${url&&isImage?`<img class="plan-thumb" src="${url}" alt="Vorschau ${key}">`:url?'<div class="plan-placeholder">PDF ansehen ↗</div>':'<div class="plan-placeholder">Noch kein Plan hochgeladen</div>'}</div>`}
function attachPlanThumbs(){document.querySelectorAll('[data-view]').forEach(el=>{const go=()=>show('plan',el.dataset.view);el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter')go()}})}
const save=()=>localStorage.setItem('micado_tasks',JSON.stringify(tasks));let activePlan='team';function show(t,key){if(key)activePlan=key;tab=t;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#heading').textContent=({home:'Übersicht',plan:'Dienstplan',tasks:'Meine Aufgaben',docs:'KI-Dokumentationshilfe',handover:'Übergabe',links:'Schnellzugriffe'})[t];render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function render(){renderHome();renderPlan();renderTasks();renderDocs();renderHandover();renderLinks()}function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dueTasks(){return tasks.filter(t=>!t.done&&t.date).sort((a,b)=>a.date.localeCompare(b.date))}function dueLabel(date){return date<localDay()?'Überfällig':date===localDay()?'Heute fällig':'Fällig: '+date.split('-').reverse().join('.')}function renderHome(){let open=tasks.filter(x=>!x.done),due=dueTasks(),limit=new Date();limit.setDate(limit.getDate()+7);let soon=due.filter(t=>t.date<=`${limit.getFullYear()}-${String(limit.getMonth()+1).padStart(2,'0')}-${String(limit.getDate()).padStart(2,'0')}`);$('#home').innerHTML=`<div class="panel"><div class="mini-grid"><div class="metric"><span class="muted">Offene Aufgaben</span><strong>${open.length}</strong></div><div class="metric"><span class="muted">Fällige / bald fällige</span><strong>${soon.length}</strong></div></div><p class="muted">Bönninghardt: ${open.filter(x=>x.site==='Bönninghardt').length} · Xanten: ${open.filter(x=>x.site==='Xanten').length}</p>${due.slice(0,4).map(t=>`<div class="due"><strong>${safe(t.name)}</strong><div class="subtle">${safe(t.site)} · ${dueLabel(t.date)}</div></div>`).join('')}<button class="secondary" id="goTasks">Aufgaben & Fristen öffnen →</button></div><div class="panel"><div class="row between"><strong>Aktueller Dienstplan</strong><button id="goPlan" class="ghost">Verwalten →</button></div><div class="plan-title">Gesamt Team</div>${planThumb('team',true)}<div class="plan-small-grid"><div><div class="plan-title">Blau</div>${planThumb('blau')}</div><div><div class="plan-title">Nachtwachen</div>${planThumb('nacht')}</div></div><p class="muted small">Zum Vergrößern einen Plan antippen.</p></div><div class="panel"><strong>Mein Arbeitstag</strong><p class="muted">Checklisten, Dokumentation und wichtige Seiten direkt öffnen.</p><div class="quick-grid"><button id="goHandover">☑ Übergabe</button><button id="goDocs" class="secondary">✦ KI-Doku</button><button id="goLinks" class="secondary">↗ Schnellzugriffe</button></div></div>`;$('#goPlan').onclick=()=>show('plan');$('#goTasks').onclick=()=>show('tasks');$('#goDocs').onclick=()=>show('docs');$('#goHandover').onclick=()=>show('handover');$('#goLinks').onclick=()=>show('links');attachPlanThumbs()}
function renderPlan(){$('#plan').innerHTML=`<div class="panel"><strong>Monatsdienstpläne</strong><p class="muted">Für jeden Bereich kannst du ein eigenes Foto oder PDF auswählen. Die Dateien bleiben auf diesem Gerät.</p><div class="chips">${PLAN_TYPES.map(([key,label])=>`<button data-plan-tab="${key}" class="${activePlan===key?'selected':''}">${label}</button>`).join('')}</div><label>${safe(PLAN_TYPES.find(x=>x[0]===activePlan)[1])} – Foto oder PDF auswählen</label><input id="planFile" type="file" accept="application/pdf,image/*"><p class="small muted">${planMetaAll[activePlan]?'Aktuell: '+safe(planMetaAll[activePlan].name):'Noch kein Plan ausgewählt'}</p><div id="planView">${planFiles[activePlan]?planThumb(activePlan,true):'<p class="muted">Bitte einen Plan auswählen.</p>'}</div>${planFiles[activePlan]?'<p><button class="secondary" id="openPlan">Großansicht öffnen ↗</button></p>':''}</div>`;document.querySelectorAll('[data-plan-tab]').forEach(el=>el.onclick=()=>{activePlan=el.dataset.planTab;renderPlan()});$('#planFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const key=activePlan;storePlan(f,key).catch(()=>alert('Die Datei konnte nicht dauerhaft gespeichert werden.'));if(planFiles[key])URL.revokeObjectURL(planFiles[key]);planFiles[key]=URL.createObjectURL(f);planMetaAll[key]={name:f.name,type:f.type};localStorage.setItem('micado_plan_meta_all',JSON.stringify(planMetaAll));renderPlan();renderHome()};if(planFiles[activePlan])$('#openPlan').onclick=()=>window.open(planFiles[activePlan],'_blank');attachPlanThumbs()}

function renderTasks(){$('#tasks').innerHTML=`<div class="chips"><button data-site="Bönninghardt" class="${site==='Bönninghardt'?'selected':''}">Bönninghardt</button><button data-site="Xanten" class="${site==='Xanten'?'selected':''}">Xanten</button></div><div class="panel"><div class="row between"><strong>Aufgaben</strong><span class="muted">${tasks.filter(t=>t.site===site&&!t.done).length} offen</span></div><div id="taskList">${tasks.filter(t=>t.site===site).map(t=>`<div class="task"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div class="name ${t.done?'done':''}"><div>${safe(t.name)}</div><div class="muted">${t.date?safe(t.date)+' · ':''}${safe(t.priority)}</div></div><button class="ghost" data-delete="${t.id}" aria-label="Löschen">✕</button></div>`).join('')||'<p class="muted">Noch keine Aufgaben vorhanden.</p>'}</div></div><div class="panel"><strong>Neue Aufgabe</strong><form id="taskForm"><label>Beschreibung</label><input name="name" maxlength="180" required placeholder="Was ist zu erledigen?"><label>Fällig am (optional)</label><input name="date" type="date"><label>Priorität</label><select name="priority"><option>Normal</option><option>Wichtig</option><option>Dringend</option></select><p><button type="submit">+ Aufgabe hinzufügen</button></p></form></div>`;document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{site=b.dataset.site;renderTasks()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{tasks=tasks.map(t=>t.id===b.dataset.check?{...t,done:b.checked}:t);save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{tasks=tasks.filter(t=>t.id!==b.dataset.delete);save();render()});$('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);tasks.push({id:crypto.randomUUID(),site,name:String(f.get('name')).trim(),date:String(f.get('date')),priority:String(f.get('priority')),done:false});save();render()}}
let speechRecognition=null;
function dictateTo(id,btn){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById(id).focus();alert('Bitte nutze das Mikrofon auf der iPhone-Tastatur, um deinen Text zu diktieren.');return}if(speechRecognition){speechRecognition.stop();return}const rec=new SR();speechRecognition=rec;rec.lang='de-DE';rec.continuous=true;rec.interimResults=false;btn.textContent='■ Aufnahme beenden';rec.onresult=e=>{const field=document.getElementById(id);if(!field)return;let spoken='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)spoken+=e.results[i][0].transcript+' ';if(spoken)field.value+=(field.value.trim()?' ':'')+spoken.trim()};rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted')alert('Spracherkennung nicht verfügbar. Bitte das Mikrofon auf der iPhone-Tastatur verwenden.')};rec.onend=()=>{speechRecognition=null;btn.textContent='🎙 Spracheingabe starten'};try{rec.start()}catch{speechRecognition=null;btn.textContent='🎙 Spracheingabe starten'}}
const defaultCheck=['Termine und Rückmeldungen prüfen','Offene organisatorische Aufgaben prüfen','Bestellungen und Materialbedarf prüfen','Wichtige Informationen für den Folgedienst festhalten'];let checklist=readJSON('micado_checklist_v1',{}),customChecks=readJSON('micado_custom_checks_v1',{}),checkSite='Bönninghardt';function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}function persistChecks(){localStorage.setItem('micado_checklist_v1',JSON.stringify(checklist));localStorage.setItem('micado_custom_checks_v1',JSON.stringify(customChecks))}function renderHandover(){let names=[...defaultCheck,...(customChecks[checkSite]||[])],today=localDay(),key=checkSite+'|'+today,checked=checklist[key]||[];$('#handover').innerHTML=`<div class="chips"><button data-csite="Bönninghardt" class="${checkSite==='Bönninghardt'?'selected':''}">Bönninghardt</button><button data-csite="Xanten" class="${checkSite==='Xanten'?'selected':''}">Xanten</button></div><div class="panel"><strong>Übergabe-Checkliste</strong><p class="muted">${safe(checkSite)} · ${today.split('-').reverse().join('.')} · ${checked.length} von ${names.length} erledigt</p><p class="notice">Nur organisatorische Punkte eintragen – keine Bewohnernamen oder Gesundheitsdaten. Die Häkchen gelten jeweils für den aktuellen Tag auf diesem Gerät.</p>${names.map((name,i)=>`<div class="checkline"><input type="checkbox" data-ck="${i}" ${checked.includes(i)?'checked':''}><span class="${checked.includes(i)?'done':''}">${safe(name)}</span>${i>=defaultCheck.length?`<button class="ghost" data-delck="${i-defaultCheck.length}">✕</button>`:''}</div>`).join('')}<form id="checkForm"><label>Eigener Checklistenpunkt</label><input name="point" required maxlength="160" placeholder="z. B. Schlüsselübergabe prüfen"><p><button>+ Hinzufügen</button></p></form><button class="secondary" id="resetChecks">Heutige Häkchen zurücksetzen</button></div>`;document.querySelectorAll('[data-csite]').forEach(b=>b.onclick=()=>{checkSite=b.dataset.csite;renderHandover()});document.querySelectorAll('[data-ck]').forEach(b=>b.onchange=()=>{let a=new Set(checklist[key]||[]),n=Number(b.dataset.ck);b.checked?a.add(n):a.delete(n);checklist[key]=[...a];persistChecks();renderHandover()});document.querySelectorAll('[data-delck]').forEach(b=>b.onclick=()=>{customChecks[checkSite].splice(Number(b.dataset.delck),1);checklist[key]=[];persistChecks();renderHandover()});$('#checkForm').onsubmit=e=>{e.preventDefault();let val=new FormData(e.target).get('point').trim();if(!val)return;(customChecks[checkSite]??=[]).push(val);persistChecks();renderHandover()};$('#resetChecks').onclick=()=>{checklist[key]=[];persistChecks();renderHandover()}}
let shortcuts=readJSON('micado_shortcuts_v1',[{name:'SharePoint',url:'https://www.microsoft365.com/launch/sharepoint'},{name:'Outlook',url:'https://outlook.office.com/'}]);function validLink(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)}catch{return false}}function renderLinks(){$('#links').innerHTML=`<div class="panel"><strong>Micado-Schnellzugriffe</strong><p class="muted">Deine häufig genutzten Seiten. Bitte keine Passwörter in Links speichern.</p><div class="quick-grid">${shortcuts.map((l,i)=>`<div><a class="quick-link" href="${safe(l.url)}" target="_blank" rel="noopener noreferrer">↗ ${safe(l.name)}</a><button class="ghost" data-dellink="${i}">Entfernen</button></div>`).join('')}</div></div><div class="panel"><strong>Link hinzufügen</strong><form id="linkForm"><label>Bezeichnung</label><input name="name" maxlength="55" required placeholder="z. B. Formulare"><label>Webadresse (https://...)</label><input name="url" type="url" required placeholder="https://..."><p><button>+ Schnellzugriff hinzufügen</button></p></form></div>`;document.querySelectorAll('[data-dellink]').forEach(b=>b.onclick=()=>{shortcuts.splice(Number(b.dataset.dellink),1);localStorage.setItem('micado_shortcuts_v1',JSON.stringify(shortcuts));renderLinks()});$('#linkForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')).trim(),url=String(f.get('url')).trim();if(!validLink(url)){alert('Bitte eine gültige https://-Adresse angeben.');return}shortcuts.push({name,url});localStorage.setItem('micado_shortcuts_v1',JSON.stringify(shortcuts));renderLinks()}}
let docMode='ausführlich';function renderDocs(){$('#docs').innerHTML=`<div class="panel"><strong>KI-Dokumentationsassistent</strong><p class="notice"><strong>Datenschutz:</strong> Nur vollständig anonymisierte Angaben eingeben. Keine Namen, Initialen, Geburtsdaten, konkreten Diagnosen oder identifizierenden Einzelheiten. Spracheingabe und ChatGPT können Daten an externe Anbieter übertragen. Noch keine automatische KI-Anbindung.</p><label>Art der Dokumentation</label><select id="docMode"><option value="kurz" ${docMode==='kurz'?'selected':''}>Kurz & sachlich</option><option value="ausführlich" ${docMode==='ausführlich'?'selected':''}>Ausführlicher Verlaufsbericht</option><option value="ereignis" ${docMode==='ereignis'?'selected':''}>Besonderes Ereignis</option></select><label>Beobachtung (anonymisiert)</label><textarea id="observation" placeholder="Was ist konkret passiert? Was wurde beobachtet?"></textarea><p><button class="secondary" data-dictate="observation">🎙 Spracheingabe starten</button></p><label>Durchgeführte Maßnahme (optional)</label><textarea id="measure" placeholder="Was wurde tatsächlich unternommen?"></textarea><p><button class="secondary" data-dictate="measure">🎙 Spracheingabe starten</button></p><label>Ergebnis / weiterer Verlauf (optional)</label><textarea id="outcome" placeholder="Was war danach zu beobachten?"></textarea><p><button class="secondary" data-dictate="outcome">🎙 Spracheingabe starten</button></p><p class="subtle">Falls die Aufnahme nicht startet, nutze das Mikrofon auf der iPhone-Tastatur. Die App speichert keine Audiodatei.</p><button id="makeDoc">Entwurf erstellen</button><div id="draft"></div></div>`;$('#docMode').onchange=e=>docMode=e.target.value;document.querySelectorAll('[data-dictate]').forEach(b=>b.onclick=()=>dictateTo(b.dataset.dictate,b));$('#makeDoc').onclick=()=>{let o=$('#observation').value.trim(),m=$('#measure').value.trim(),r=$('#outcome').value.trim();if(!o){alert('Bitte zuerst eine Beobachtung eingeben.');return}let txt=`Beobachtung:\n${o}\n\nDurchgeführte Maßnahme:\n${m||'Nicht angegeben'}\n\nErgebnis / weiterer Verlauf:\n${r||'Nicht angegeben'}`;$('#draft').innerHTML=`<label>Dein Entwurf (bearbeitbar)</label><textarea id="result" style="min-height:220px"></textarea><div class="actionrow"><button id="copy" class="secondary">Text kopieren</button><button id="ai" type="button">✦ Mit ChatGPT ausformulieren</button></div><p class="subtle">Die KI öffnet sich separat. Prüfe den Text vorher auf identifizierende Angaben und füge ihn dort selbst ein. KI-Ergebnisse immer fachlich prüfen.</p>`;$('#result').value=txt;$('#copy').onclick=()=>copyText($('#result').value,'#copy');$('#ai').onclick=()=>{let text=$('#result').value.trim();if(!text)return;let instructions=docMode==='kurz'?'kurze, sachliche Dokumentation':docMode==='ereignis'?'strukturierte Dokumentation eines besonderen Ereignisses mit Situation, Beobachtung, Maßnahmen und Ergebnis':'ausführliche, fachlich sachliche Verlaufsdokumentation';let prompt=`Erstelle eine ${instructions} aus den folgenden anonymisierten Notizen. Formuliere flüssig, präzise und professionell. Ergänze keine Tatsachen, Maßnahmen, Reaktionen, Zeitangaben oder Diagnosen, die nicht in den Notizen stehen. Trenne Beobachtungen von Interpretationen. Fehlen wesentliche Angaben, frage nach, statt sie zu erfinden. Gib nur die Dokumentation und gegebenenfalls kurze Rückfragen aus.\n\n${text}`;copyText(prompt,'#ai').then(ok=>{if(ok&&confirm('Anonymisierte Anfrage kopiert. ChatGPT öffnen? Du musst den Text dort selbst einfügen.'))window.open('https://chatgpt.com/','_blank','noopener')})}}}
async function copyText(text,selector){try{await navigator.clipboard.writeText(text);let b=$(selector);if(b)b.textContent='Kopiert ✓';return true}catch{alert('Kopieren nicht möglich. Bitte Text markieren und manuell kopieren.');return false}}

render();restorePlan();if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
