<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#68a96d"><title>Mein Micado</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#343a36;background:#f1f6f0}*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:auto;min-height:100vh;background:#f9fbf8;padding:22px 18px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:2px 0 18px;font-size:28px}.eyebrow{font-size:11px;letter-spacing:2px;color:#648188;font-weight:800}.panel{background:white;border:1px solid #e1e9e7;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #143e4208}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #dae4e2;display:flex;justify-content:center;padding:9px 4px 18px;gap:4px}nav button{flex:1;max-width:160px;font-size:12px;background:none;color:#567078}nav button.active{color:#68a96d;font-weight:800}button{border:0;border-radius:11px;padding:12px 14px;font-weight:700;cursor:pointer;background:#68a96d;color:white}button.secondary{background:#e8f3e7;color:#387d42}button.ghost{background:transparent;color:#637b7f;padding:6px}input,textarea,select{width:100%;padding:12px;border:1px solid #cddcda;border-radius:10px;font:inherit;background:white}textarea{min-height:135px;resize:vertical}.row{display:flex;align-items:center;gap:9px}.row>*{min-width:0}.between{justify-content:space-between}.muted{color:#688087;font-size:13px}.chips{display:flex;gap:8px;margin:12px 0}.chips button{flex:1;background:#e8f3e7;color:#47666a}.chips button.selected{background:#68a96d;color:white}.task{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #e9eeee}.task input{width:18px;height:18px}.task .name{flex:1}.done{text-decoration:line-through;color:#94a3a4}.pill{font-size:11px;border-radius:20px;padding:5px 8px;background:#f0f4f3}.hidden{display:none}iframe{width:100%;height:58vh;border:1px solid #e3e9e7;border-radius:12px}.small{font-size:12px}label{font-size:13px;font-weight:650;display:block;margin:10px 0 5px}.stat{font-size:32px;font-weight:800;margin:4px 0}a{color:#68a96d}</style></head><body><main class="shell"><header><img src="logo.png" alt="Micado" style="width:185px;max-width:72%;height:auto;object-fit:contain"><span style="color:#68a96d">●</span></header><h1 id="heading">Übersicht</h1><section id="home"></section><section id="plan" class="hidden"></section><section id="tasks" class="hidden"></section><section id="docs" class="hidden"></section></main><nav><button data-tab="home" class="active">⌂<br>Start</button><button data-tab="plan">▦<br>Dienstplan</button><button data-tab="tasks">☑<br>Aufgaben</button><button data-tab="docs">▤<br>Doku</button></nav><script>
const $=s=>document.querySelector(s);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let tab='home',site='Bönninghardt',tasks=JSON.parse(localStorage.getItem('micado_tasks')||'[]'),planMeta=JSON.parse(localStorage.getItem('micado_plan_meta')||'null');let planURL=null;const DB_NAME="micado-local";function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>req.result.createObjectStore("files");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function storePlan(file){const db=await openDB();await new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,"current");tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}async function restorePlan(){try{const db=await openDB();const f=await new Promise((resolve,reject)=>{const req=db.transaction("files").objectStore("files").get("current");req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});db.close();if(f){planURL=URL.createObjectURL(f);render()}}catch(e){console.warn(e)}}const save=()=>localStorage.setItem('micado_tasks',JSON.stringify(tasks));function show(t){tab=t;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('#heading').textContent=({home:'Übersicht',plan:'Dienstplan',tasks:'Meine Aufgaben',docs:'Dokumentationshilfe'})[t];render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.tab));function render(){renderHome();renderPlan();renderTasks();renderDocs()}function renderHome(){let open=tasks.filter(x=>!x.done);$('#home').innerHTML=`<div class="panel"><div class="muted">Offene Aufgaben</div><div class="stat">${open.length}</div><div class="row between"><span>Bönninghardt: ${open.filter(x=>x.site==='Bönninghardt').length}</span><span>Xanten: ${open.filter(x=>x.site==='Xanten').length}</span></div></div><div class="panel"><strong>Aktueller Dienstplan</strong><p class="muted">${safe(planMeta?.name||'Noch kein Dienstplan hochgeladen')}</p><button id="goPlan" class="secondary">Dienstplan öffnen →</button></div><div class="panel"><strong>Schnellzugriff</strong><p class="muted">Aufgaben verwalten oder einen sachlichen Dokumentationsentwurf vorbereiten.</p><div class="row"><button id="goTasks">Aufgaben</button><button id="goDocs" class="secondary">Dokumentation</button></div></div>`;$('#goPlan').onclick=()=>show('plan');$('#goTasks').onclick=()=>show('tasks');$('#goDocs').onclick=()=>show('docs')}
function renderPlan(){$('#plan').innerHTML=`<div class="panel"><strong>Dienstplan als PDF oder Foto</strong><p class="muted">Wähle deinen aktuellen Plan. Die Datei wird nur in diesem Browser geöffnet und nicht an einen Server übertragen.</p><input id="planFile" type="file" accept="application/pdf,image/*"><p class="small muted">Hinweis: Die Datei wird lokal auf diesem Gerät gespeichert, sofern der Browser den Speicher nicht löscht.</p>${planMeta?`<p class="muted">Zuletzt ausgewählt: ${safe(planMeta.name)}</p>`:''}<div id="planView">${planURL?'<iframe id="planFrame" title="Dienstplan"></iframe>':''}</div></div>`;$('#planFile').onchange=e=>{let f=e.target.files[0];if(!f)return;storePlan(f).catch(()=>alert("Die Datei konnte nicht dauerhaft gespeichert werden."));if(planURL)URL.revokeObjectURL(planURL);planURL=URL.createObjectURL(f);planMeta={name:f.name};localStorage.setItem('micado_plan_meta',JSON.stringify(planMeta));renderPlan();const frame=$('#planFrame');if(frame)frame.src=planURL;renderHome()};if(planURL&&$('#planFrame'))$('#planFrame').src=planURL}
function renderTasks(){$('#tasks').innerHTML=`<div class="chips"><button data-site="Bönninghardt" class="${site==='Bönninghardt'?'selected':''}">Bönninghardt</button><button data-site="Xanten" class="${site==='Xanten'?'selected':''}">Xanten</button></div><div class="panel"><div class="row between"><strong>Aufgaben</strong><span class="muted">${tasks.filter(t=>t.site===site&&!t.done).length} offen</span></div><div id="taskList">${tasks.filter(t=>t.site===site).map(t=>`<div class="task"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><div class="name ${t.done?'done':''}"><div>${safe(t.name)}</div><div class="muted">${t.date?safe(t.date)+' · ':''}${safe(t.priority)}</div></div><button class="ghost" data-delete="${t.id}" aria-label="Löschen">✕</button></div>`).join('')||'<p class="muted">Noch keine Aufgaben vorhanden.</p>'}</div></div><div class="panel"><strong>Neue Aufgabe</strong><form id="taskForm"><label>Beschreibung</label><input name="name" maxlength="180" required placeholder="Was ist zu erledigen?"><label>Fällig am (optional)</label><input name="date" type="date"><label>Priorität</label><select name="priority"><option>Normal</option><option>Wichtig</option><option>Dringend</option></select><p><button type="submit">+ Aufgabe hinzufügen</button></p></form></div>`;document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{site=b.dataset.site;renderTasks()});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{tasks=tasks.map(t=>t.id===b.dataset.check?{...t,done:b.checked}:t);save();render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{tasks=tasks.filter(t=>t.id!==b.dataset.delete);save();render()});$('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);tasks.push({id:crypto.randomUUID(),site,name:String(f.get('name')).trim(),date:String(f.get('date')),priority:String(f.get('priority')),done:false});save();render()}}
function renderDocs(){$('#docs').innerHTML=`<div class="panel"><strong>Dokumentationsassistent</strong><p class="muted">Schreibe eine anonymisierte Beobachtung. Die Vorlage hilft, Fakten und Interpretation zu trennen. Eine KI-Umformulierung ist in dieser Offline-Version noch nicht angebunden.</p><label>Beobachtung (ohne Namen oder Gesundheitsdaten)</label><textarea id="observation" placeholder="Was wurde wann und wo beobachtet?"></textarea><label>Durchgeführte Maßnahme</label><textarea id="measure" placeholder="Was wurde konkret unternommen?"></textarea><label>Ergebnis / weiterer Verlauf</label><textarea id="outcome" placeholder="Wie hat sich die Situation entwickelt?"></textarea><p><button id="makeDoc">Dokumentation vorbereiten</button></p><div id="draft"></div></div>`;$('#makeDoc').onclick=()=>{let o=$('#observation').value.trim(),m=$('#measure').value.trim(),r=$('#outcome').value.trim();if(!o){alert('Bitte zuerst eine Beobachtung eingeben.');return}let txt=`Beobachtung:\n${o}\n\nDurchgeführte Maßnahme:\n${m||'Nicht angegeben'}\n\nErgebnis / weiterer Verlauf:\n${r||'Nicht angegeben'}`;$('#draft').innerHTML=`<label>Entwurf zum Prüfen und Kopieren</label><textarea id="result" style="min-height:220px"></textarea><p><button id="copy" class="secondary">Text kopieren</button></p>`;$('#result').value=txt;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#result').value);$('#copy').textContent='Kopiert ✓'}catch{ $('#result').select();alert('Text markieren und kopieren.')}}}}
render();restorePlan();if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
